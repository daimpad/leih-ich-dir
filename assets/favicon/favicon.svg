<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Die Bildmarke von LeihIchDir: das L der Wortmarke und ihre Kugel, aus
       Knete, auf einem Minzkissen. Sie bringt ihre Farben mit und folgt dem
       Erscheinungsbild nicht. Das L ist ein Pfad und keine Schrift: Ein
       Bild im <img> erreicht die Schriften der Seite nicht. -->
  <defs>
    <filter id="knete" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="weich"/>
      <feOffset in="weich" dx="-2.6" dy="-3.4" result="hoch"/>
      <feComposite in="SourceAlpha" in2="hoch" operator="out" result="unterkante"/>
      <feFlood flood-color="#003221" flood-opacity=".24"/>
      <feComposite in2="unterkante" operator="in" result="schatten"/>
      <feOffset in="weich" dx="2.6" dy="3.4" result="tief"/>
      <feComposite in="SourceAlpha" in2="tief" operator="out" result="oberkante"/>
      <feFlood flood-color="#FFFFFF" flood-opacity=".8"/>
      <feComposite in2="oberkante" operator="in" result="licht"/>
      <feDropShadow in="SourceGraphic" dx="2" dy="4" stdDeviation="3" flood-color="#007E5A" flood-opacity=".28" result="geworfen"/>
      <feMerge>
        <feMergeNode in="geworfen"/>
        <feMergeNode in="schatten"/>
        <feMergeNode in="licht"/>
      </feMerge>
    </filter>
    <radialGradient id="kissen" cx="34%" cy="26%" r="85%">
      <stop offset="0" stop-color="#E2FAF4"/><stop offset=".55" stop-color="#B8F2E6"/><stop offset="1" stop-color="#7CD9C4"/>
    </radialGradient>
    <radialGradient id="l" cx="36%" cy="24%" r="85%">
      <stop offset="0" stop-color="#FFC7D7"/><stop offset=".5" stop-color="#FF9DBA"/><stop offset="1" stop-color="#EC7CA0"/>
    </radialGradient>
    <radialGradient id="kugel" cx="36%" cy="30%" r="80%">
      <stop offset="0" stop-color="#FFDCC6"/><stop offset=".5" stop-color="#FFB58A"/><stop offset="1" stop-color="#EC915F"/>
    </radialGradient>
  </defs>
  <rect x="6" y="5" width="82" height="82" rx="28" fill="url(#kissen)" filter="url(#knete)"/>
  <g filter="url(#knete)">
    <path d="M32 28V62H54" fill="none" stroke="#C4567B" stroke-width="21" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 4)"/>
    <path d="M32 28V62H54" fill="none" stroke="#FF9DBA" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 28V62H54" fill="none" stroke="url(#l)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="73" cy="66" r="7.5" fill="#C7703F"/>
    <circle cx="73" cy="62.5" r="7.5" fill="url(#kugel)"/>
  </g>
</svg>
