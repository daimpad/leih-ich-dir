<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LeihIchDir">
  <!--
    Das Zeichen der Anwendung. Eine Katzenpfote, weil die Zeichnung im Hero
    dieselbe ist: Die Pfote haelt ihre eigene Leihliste. Auf 16 Punkten ist
    von einer Wortmarke nichts mehr zu lesen, von dieser Form dagegen schon.

    Die Zehen stehen bewusst weit auseinander: Ihre Luecken messen je rund
    2,3 Einheiten der viewBox, also gut ein halbes Pixel bei 16 Punkten. Eine
    engere Reihe verschmilzt dort zu einem Balken. Reihe und Ballen sind beide
    auf x = 32 zentriert, damit das Zeichen im Rahmen nicht verrutscht.

    Die Farben stehen im Dokument und folgen der Systemvorgabe, damit das
    Zeichen auch auf einer dunklen Registerleiste steht. Ein <style> im SVG
    ist zulaessig: Die Datei ist ein eigenes Dokument, die CSP der Seite
    greift hier nicht.
  -->
  <style>
    .grund { fill: #FCF9F4; }
    .pfote { fill: #0F7A55; }
    @media (prefers-color-scheme: dark) {
      .grund { fill: #211D17; }
      .pfote { fill: #3FCE96; }
    }
  </style>
  <rect class="grund" width="64" height="64" rx="14"/>
  <g class="pfote">
    <ellipse cx="14" cy="26" rx="4.5" ry="6.4" transform="rotate(-24 14 26)"/>
    <ellipse cx="26" cy="20" rx="4.8" ry="6.6" transform="rotate(-6 26 20)"/>
    <ellipse cx="38" cy="20" rx="4.8" ry="6.6" transform="rotate(6 38 20)"/>
    <ellipse cx="50" cy="26" rx="4.5" ry="6.4" transform="rotate(24 50 26)"/>
    <path d="M32 33c8.8 0 16 5.8 16 12.8S40.8 57 32 57s-16-4.2-16-11.2S23.2 33 32 33z"/>
  </g>
</svg>
