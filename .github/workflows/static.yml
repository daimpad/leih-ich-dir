# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Die Pages-Fassung ist eine Oberflaechen-Vorschau ohne Backend. Was nur
      # den Server oder die Werkstatt angeht, gehoert nicht darauf: Auf Pages
      # gilt keine einzige Regel aus .htaccess, tools/ waere dort abrufbar —
      # und tools/og-vorlage.html traegt dieselbe Wortmarke und denselben
      # Satz wie die Startseite, also eine indexierbare Dublette.
      #
      # robots.txt und sitemap.xml fuehren absolute Adressen auf
      # leihichdir.de. Unter einer anderen Herkunft sind sie falsch, deshalb
      # bekommt die Vorschau ein eigenes robots.txt, das sie ganz heraushaelt.
      - name: Nur die Oberflaeche behalten
        run: |
          rm -rf tools tests data .github .htaccess sitemap.xml
          printf 'User-agent: *\nDisallow: /\n' > robots.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
