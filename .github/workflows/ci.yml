name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Run API tests
        run: php tests/api-test.php

      - name: Check deployment script against a local server
        run: |
          php -S 127.0.0.1:8799 -t . > /dev/null 2>&1 &
          sleep 2
          # Der eingebaute Server kennt keine .htaccess, deshalb koennen
          # Kopfzeilen und Abschottung dort nicht bestehen. Geprueft wird hier
          # nur, dass das Skript laeuft und die Schnittstelle findet.
          php tools/check-deployment.php http://127.0.0.1:8799 | tee /tmp/abnahme.txt || true
          grep -q 'api.php antwortet als Dienst                   ok' /tmp/abnahme.txt
          grep -q 'Liste anlegen, data/ ist beschreibbar          ok' /tmp/abnahme.txt

  javascript:
    name: JavaScript Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse every JavaScript file
        run: |
          # Alle ausgelieferten Skripte, nicht nur app.js. Der Fund kam daher,
          # dass theme.js und check.js dazukamen und hier zunaechst fehlten.
          find . -name '*.js' -not -path './.git/*' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -t node --check

      # CONTRIBUTING.md sagt zu: ES5-vertraegliche Syntax plus Promise, fetch
      # und crypto.subtle. node --check nimmt eine Pfeilfunktion anstandslos
      # an, die Zusage stand also bisher nur auf dem Papier. Dieselbe
      # find-Zeile wie oben, ausdruecklich ohne Namensliste: Eine Liste von
      # Dateien veraltet, sobald eine dazukommt.
      #
      # Der Rueckstrich fuer Schablonenzeichenketten steht bewusst nicht in
      # der Regel. Diese Pruefung liest den Text und nicht den Syntaxbaum, und
      # im Bestand steht er in Kommentaren und in einem regulaeren Ausdruck.
      # Eine Regel, die regelmaessig falsch anschlaegt, wird abgeschaltet.
      - name: Keine ES6-Syntax in ausgelieferten Skripten
        run: |
          treffer=$(find . -name '*.js' -not -path './.git/*' -not -path './vendor/*' -print0 \
            | xargs -0 grep -nE '=>|\b(let|const)[[:space:]]|\basync[[:space:]]|\bawait[[:space:]]' || true)
          if [ -n "$treffer" ]; then
            echo "ES5-Zusage verletzt (CONTRIBUTING.md):"
            echo "$treffer"
            exit 1
          fi

      - name: Beide Woerterbuecher vollstaendig
        run: node tools/i18n-check.js
