<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Diese Vorlage gehoert nicht ins Netz. Auf Apache sperrt .htaccess das
     ganze Verzeichnis tools/ mit 404; wo keine .htaccess gilt — GitHub
     Pages, nginx, der eingebaute PHP-Server —, traegt wenigstens diese
     Zeile dafuer Sorge, dass sie nicht als Dublette der Startseite in
     einen Index geraet. -->
<meta name="robots" content="noindex, nofollow">
<title>Vorlage für die Rasterzeichen</title>
<!--
  Vorlage für apple-touch-icon.png, favicon-96x96.png, favicon.ico und die
  Symbole des Manifests unter assets/pics/. Gehört nicht
  zur ausgelieferten Anwendung; die Anleitung steht in tools/README-og.md.

  Apple legt selbst runde Ecken an, deshalb steht das Zeichen hier randlos
  auf der Fläche. Die Pfote ist dieselbe wie in favicon.svg.
-->
<style>
  * { margin: 0; padding: 0; }
  body { background: #FCF9F4; }
  .feld { width: 180px; height: 180px; background: #FCF9F4;
          display: grid; place-items: center; }
  svg { width: 132px; height: 132px; display: block; }
</style>
</head>
<body>
  <div class="feld">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="#0F7A55">
      <ellipse cx="14" cy="26" rx="4.5" ry="6.4" transform="rotate(-24 14 26)"/>
      <ellipse cx="26" cy="20" rx="4.8" ry="6.6" transform="rotate(-6 26 20)"/>
      <ellipse cx="38" cy="20" rx="4.8" ry="6.6" transform="rotate(6 38 20)"/>
      <ellipse cx="50" cy="26" rx="4.5" ry="6.4" transform="rotate(24 50 26)"/>
      <path d="M32 33c8.8 0 16 5.8 16 12.8S40.8 57 32 57s-16-4.2-16-11.2S23.2 33 32 33z"/>
    </svg>
  </div>
</body>
</html>
