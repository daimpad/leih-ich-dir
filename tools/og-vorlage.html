<!DOCTYPE html>
<html lang="de" class="wortmarke-da ruhig">
<head>
<meta charset="utf-8">
<!-- Diese Vorlage gehoert nicht ins Netz. Auf Apache sperrt .htaccess das
     ganze Verzeichnis tools/ mit 404; wo keine .htaccess gilt — GitHub
     Pages, nginx, der eingebaute PHP-Server —, traegt wenigstens diese
     Zeile dafuer Sorge, dass sie nicht als Dublette der Startseite in
     einen Index geraet. -->
<meta name="robots" content="noindex, nofollow">
<title>Vorlage für das Vorschaubild</title>
<!--
  Vorlage für assets/pics/og.png, das Bild der Link-Vorschau.

  Diese Datei gehört nicht zur ausgelieferten Anwendung. tools/bilder.mjs
  lichtet sie auf 1200 mal 630 Punkte ab; das Ergebnis liegt als PNG im
  Projekt. So braucht die Anwendung keinen Bauschritt, und das Bild lässt
  sich trotzdem jederzeit aus dem Quelltext neu erzeugen.

  Sie schreibt nichts ab: Farben, Schrift und Knete kommen aus style.css und
  assets/fonts/, und die drei Platzhalter unten — Vorrat, Wortmarke, Dinge —
  füllt bilder.mjs beim Ablichten aus der laufenden Startseite. Allein im
  Browser geöffnet, bleiben sie deshalb leer. Die Klasse ruhig am
  Wurzelelement hält die Knete still, damit das Bild nicht vom Zeitpunkt
  der Aufnahme abhängt. Anleitung in tools/README-og.md.
-->
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../style.css">
<style>
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .blatt {
    position: absolute; inset: 44px 52px;
    display: flex; align-items: center; gap: 36px;
    padding: 46px 52px;
    border-radius: 56px;
  }
  .wort { flex: 1 1 auto; min-width: 0; }
  .wort .wortmarke { max-width: none; width: 560px; margin-left: -18px; }
  .satz { font-size: 33px; line-height: 1.32; font-weight: 700; color: var(--muted); margin-top: 18px; max-width: 15em; }
  .fuss { font-size: 27px; font-weight: 900; color: var(--link); margin-top: 26px; }
  .hero-bild { flex: 0 0 auto; width: 430px; }
  .hero-bild .dinge { grid-template-columns: repeat(3, 1fr); gap: 12px 16px; padding: 40px 26px 30px; }
  .hero-bild .kissen { inset: 6% 0 0 0; }
</style>
</head>
<body>
  <div id="vorrat"></div>
  <div class="blatt hero-panel">
    <div class="wort">
      <div id="wortmarke-platz"></div>
      <p class="satz">Zeig Deinen Freund:innen, was sie bei Dir ausleihen können.</p>
      <p class="fuss">leihichdir.de</p>
    </div>
    <div id="dinge-platz"></div>
  </div>
</body>
</html>
